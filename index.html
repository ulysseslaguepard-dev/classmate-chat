<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassMate Chat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <h1>ClassMate Chat</h1>
            <p class="user-count">Users Online: <span id="userCount">0</span></p>
        </div>

        <!-- Messages Area -->
        <div class="messages-area" id="messagesArea">
            <div class="welcome-message">
                <h2>Welcome to ClassMate Chat!</h2>
                <p>Enter your name and start chatting with your classmates.</p>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="user-input-section">
                <input type="text" id="nameInput" class="name-input" placeholder="Enter your name" maxlength="20">
                <button id="joinBtn" class="join-btn">Join Chat</button>
            </div>
            <div class="message-input-section" style="display: none;">
                <input type="text" id="messageInput" class="message-input" placeholder="Type a message..." maxlength="500">
                <button id="sendBtn" class="send-btn">Send</button>
            </div>
        </div>

        <!-- User List -->
        <div class="users-list">
            <h3>Online Users</h3>
            <ul id="usersList"></ul>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="client.js"></script>
</body>
</html>
